[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosep"
version = "0.1.0"
description = "CoSeP: Complementary Separability Pruning via Class-Separability Clustering (BMVC 2026)"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "David Levin" },
    { name = "Gonen Singer" },
]
keywords = ["pruning", "model compression", "structured pruning", "class separability", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchmetrics>=1.0.0",
    "torch-pruning>=1.6.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.5.0",
    "kmedoids>=0.4.0",
    "kneed>=0.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Paper = "https://arxiv.org/abs/2505.13225"

[project.scripts]
cosep-prune = "pruning_algorithm:main"

[tool.setuptools]
py-modules = ["pruning_algorithm"]

[tool.setuptools.packages.find]
include = ["cosep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # likely bugs
    "N",       # naming
    "D",       # docstrings (Google style, below)
    "ANN",     # type annotations
    "UP",      # modern syntax for the supported Python versions
]
ignore = [
    "ANN401",  # Any is sometimes the honest type (e.g. a module hook's output)
    "D105",    # magic methods need no docstring
    "D107",    # __init__ is documented in the class or __init__ docstring, not both
    "N812",    # `import torch.nn.functional as F` is the PyTorch convention
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: descriptive names stand in for docstrings, test docstrings describe a scenario (their first sentence may
# run over two lines), and pytest fixtures are not annotated
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D205", "ANN"]
